services:
  db:
    image: postgres:16-alpine
    container_name: qrorder_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: qrorder
      POSTGRES_PASSWORD: qrorder_secret
      POSTGRES_DB: qrorder_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrorder -d qrorder_db"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 3s

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: qrorder_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://qrorder:qrorder_secret@db:5432/qrorder_db?schema=public"
      SESSION_SECRET: "${SESSION_SECRET:-super-secret-jwt-key-qrorder-bar-32chars-minimum-key}"
      DOMAIN: "${DOMAIN:-localhost}"
      UPLOAD_DIR: "/app/public/uploads"
      STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://minio:9000}"
      S3_REGION: "${S3_REGION:-auto}"
      S3_BUCKET: "${S3_BUCKET:-qrorder-media}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-minioadmin}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-minioadmin123}"
      PUBLIC_ASSET_BASE_URL: "${PUBLIC_ASSET_BASE_URL:-}"
      PORT: 3000
      NODE_ENV: "development"
      NEXT_TELEMETRY_DISABLED: 1
      WATCHPACK_POLLING: "true"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-BDCypCIFtDcfzFm0FtXPCb2kGUsvMfdx08vrfmdz0tLmAOFrZTsLsHcQmpRr4cliAz1G039NI7uLdlSCwQ-ZGxQ}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-WHFNKKKDPYejGxW28r9VasBwXDxVYkEZQ33s3qFvhxU}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:admin@demobar.vn}"
    volumes:
      - .:/app
      - /app/node_modules
      - next_cache:/app/.next
      - uploads_data:/app/public/uploads
    command: sh -c "sh /app/scripts/entrypoint.sh"
    depends_on:
      db:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: qrorder_minio
    restart: unless-stopped
    profiles: ["minio", "s3"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local
  minio_data:
    driver: local
  next_cache:
    driver: local
